name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Format check
        run: |
          for p in src/MissionPlannerAvalonia.PluginApi/MissionPlannerAvalonia.PluginApi.csproj src/MissionPlannerAvalonia/MissionPlannerAvalonia.csproj tests/MissionPlannerAvalonia.TestPlugin.Dependency/MissionPlannerAvalonia.TestPlugin.Dependency.csproj tests/MissionPlannerAvalonia.TestPlugin/MissionPlannerAvalonia.TestPlugin.csproj tests/MissionPlannerAvalonia.Tests/MissionPlannerAvalonia.Tests.csproj; do
            dotnet format whitespace "$p" --verify-no-changes --exclude external/
            dotnet format style "$p" --verify-no-changes --exclude external/
          done

      - name: Test
        run: dotnet test tests/MissionPlannerAvalonia.Tests/MissionPlannerAvalonia.Tests.csproj -c Release -m:1

  # Compile on every release OS so cross-platform restore/build breaks fail here, not at tag time.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/MissionPlannerAvalonia/MissionPlannerAvalonia.csproj -c Release -m:1

      - name: macOS IOKit joystick smoke test
        if: matrix.os == 'macos-15'
        run: >-
          dotnet test tests/MissionPlannerAvalonia.Tests/MissionPlannerAvalonia.Tests.csproj
          -c Release -m:1 --filter FullyQualifiedName~Mac_backend_loads_iokit

      - name: macOS SimpleBLE load and adapter smoke test
        if: matrix.os == 'macos-15'
        run: >-
          dotnet test tests/MissionPlannerAvalonia.Tests/MissionPlannerAvalonia.Tests.csproj
          -c Release -m:1 --filter FullyQualifiedName~Mac_native_backend_loads

      - name: macOS bundled libVLC load and MJPEG pipeline smoke test
        if: matrix.os == 'macos-15'
        run: >-
          dotnet test tests/MissionPlannerAvalonia.Tests/MissionPlannerAvalonia.Tests.csproj
          -c Release -m:1
          --filter "FullyQualifiedName~Mac_bundled_libvlc_loads|FullyQualifiedName~Libvlc_pipeline_exports"
