name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: src/MissionPlannerAvalonia/MissionPlannerAvalonia.csproj

jobs:
  validate-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check tag matches current year.month (UTC)
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ ! "$V" =~ ^[0-9]{4}\.[0-9]{1,2}(\..+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not CalVer (expected vYYYY.M or vYYYY.M.patch)."
            exit 1
          fi
          TAG_YEAR="${V%%.*}"
          REST="${V#*.}"
          TAG_MONTH="${REST%%.*}"
          NOW_YEAR="$(date -u +%Y)"
          NOW_MONTH="$(date -u +%-m)"
          if [[ "$TAG_YEAR" != "$NOW_YEAR" || "$TAG_MONTH" != "$NOW_MONTH" ]]; then
            echo "::error::CalVer mismatch: tag is ${TAG_YEAR}.${TAG_MONTH} but current UTC date is ${NOW_YEAR}.${NOW_MONTH}. Re-tag with v${NOW_YEAR}.${NOW_MONTH}."
            exit 1
          fi
          echo "OK: ${TAG_YEAR}.${TAG_MONTH} matches current UTC month."

  package:
    needs: validate-version
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME:-dev}"
          V="${REF#v}"
          # Patch = 3rd CalVer field (default 0). Passed as VersionPatch so the app project's
          # date-derived Version resolves to this; we must NOT pass a global -p:Version because
          # it leaks into the shielded submodule's MetaDataExtractor ProjectReference.
          IFS=. read -r _y _m _p <<< "$V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "patch=${_p:-0}" >> "$GITHUB_OUTPUT"
          echo "fv=$V.0" >> "$GITHUB_OUTPUT"

      - name: Package macOS (.app, self-contained, signed + notarized)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          V=${{ steps.ver.outputs.v }}
          rm -rf out/osx dist
          dotnet publish "$APP" -c Release -r osx-arm64 --self-contained true \
            -p:DebugType=none -p:StripSymbols=true \
            -p:VersionPatch="${{ steps.ver.outputs.patch }}" -p:FileVersion="${{ steps.ver.outputs.fv }}" -p:AssemblyVersion="${{ steps.ver.outputs.fv }}" \
            -o out/osx

          # Import the Developer ID cert into a throwaway keychain when secrets are present;
          # make-app.sh does hardened-runtime signing if SIGN_IDENTITY is exported, else ad-hoc.
          if [[ -n "$MACOS_CERT_P12" && -n "$MACOS_SIGN_IDENTITY" ]]; then
            KP="$(uuidgen)"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p "$KP" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KP" "$KEYCHAIN"
            echo "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/cert.p12"
            if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
              echo "::error::No Developer ID Application identity after import — check MACOS_CERT_P12 (must be built with OpenSSL -legacy) and MACOS_CERT_PASSWORD."
              exit 1
            fi
            export SIGN_IDENTITY="$MACOS_SIGN_IDENTITY"
          fi

          chmod +x build/macos/make-app.sh
          ./build/macos/make-app.sh out/osx "$V" "dist/Mission Planner.app"

          mkdir -p upload
          ZIP="upload/MissionPlannerAvalonia-$V-osx-arm64.zip"
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent "Mission Planner.app" "../$ZIP" )

          # Notarize the zip, then staple the ticket onto the bundle and re-zip so the
          # stapled .app is what ships. No creds (forks) => skip; ad-hoc build still uploads.
          if [[ -n "$MACOS_NOTARY_KEY" && -n "$MACOS_NOTARY_KEY_ID" && -n "$MACOS_NOTARY_ISSUER" ]]; then
            echo "$MACOS_NOTARY_KEY" | base64 -D > "$RUNNER_TEMP/nkey.p8"
            xcrun notarytool submit "$ZIP" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" \
              --wait
            rm -f "$RUNNER_TEMP/nkey.p8"
            xcrun stapler staple "dist/Mission Planner.app"
            rm -f "$ZIP"
            ( cd dist && ditto -c -k --sequesterRsrc --keepParent "Mission Planner.app" "../$ZIP" )
          fi

      - name: Package Windows (self-contained folder)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          V=${{ steps.ver.outputs.v }}
          rm -rf out/win stage
          # Self-contained folder (loose dlls) so the auto-updater can diff and download only the
          # changed files instead of the whole exe.
          dotnet publish "$APP" -c Release -r win-x64 --self-contained true \
            -p:DebugType=none \
            -p:VersionPatch="${{ steps.ver.outputs.patch }}" -p:FileVersion="${{ steps.ver.outputs.fv }}" -p:AssemblyVersion="${{ steps.ver.outputs.fv }}" \
            -o out/win
          DIR="MissionPlannerAvalonia-$V-win-x64"
          mkdir -p "stage/$DIR"
          cp -r out/win/. "stage/$DIR/"
          mkdir -p upload
          ( cd stage && 7z a -tzip "../upload/$DIR.zip" "$DIR" >/dev/null )

      - name: Package Linux (self-contained)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          V=${{ steps.ver.outputs.v }}
          rm -rf out/linux
          dotnet publish "$APP" -c Release -r linux-x64 --self-contained true \
            -p:DebugType=none \
            -p:VersionPatch="${{ steps.ver.outputs.patch }}" -p:FileVersion="${{ steps.ver.outputs.fv }}" -p:AssemblyVersion="${{ steps.ver.outputs.fv }}" \
            -o out/linux
          cp build/linux/missionplanner-avalonia.desktop out/linux/
          cp build/linux/missionplanner-avalonia.png out/linux/
          cp build/linux/install.sh out/linux/
          chmod +x out/linux/MissionPlannerAvalonia out/linux/install.sh
          DIR="MissionPlannerAvalonia-$V-linux-x64"
          mv out/linux "out/$DIR"
          mkdir -p upload
          tar -czf "upload/$DIR.tar.gz" -C out "$DIR"

      - name: Build + sign update manifest
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          V=${{ steps.ver.outputs.v }}
          RID=${{ matrix.rid }}
          case "$RID" in
            win-x64)   PUB=out/win ;;
            osx-arm64) PUB=out/osx ;;
            linux-x64) PUB="out/MissionPlannerAvalonia-$V-linux-x64" ;;
          esac
          SITE="site/$RID"
          rm -rf "$SITE"; mkdir -p "$SITE"
          NOTES="https://github.com/sema-aviation/MissionPlanner-Avalonia/releases/tag/v$V"
          if [[ "$RID" == "osx-arm64" ]]; then
            # macOS updates whole-bundle (notarization can't survive loose-file swaps). The manifest
            # points at the notarized .app zip that the release job publishes as a release asset; the
            # URL is deterministic from the tag, so it resolves once release + pages jobs finish.
            ZIP="upload/MissionPlannerAvalonia-$V-osx-arm64.zip"
            BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/MissionPlannerAvalonia-$V-osx-arm64.zip"
            BUNDLE_SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
            BUNDLE_SIZE=$(stat -f%z "$ZIP")
            python3 build/gen-manifest.py "$SITE" "$V" "$NOTES" "$SITE/manifest.json" \
              --bundle-url "$BUNDLE_URL" --bundle-sha256 "$BUNDLE_SHA" --bundle-size "$BUNDLE_SIZE"
          else
            cp -R "$PUB"/. "$SITE"/
            python3 build/gen-manifest.py "$SITE" "$V" "$NOTES" "$SITE/manifest.json"
          fi
          # Sign the exact manifest bytes with the Ed25519 private key (raw 64-byte sig, base64).
          printf '%s' "$SIGNING_KEY" > update_key.pem
          # macOS runners ship LibreSSL, which lacks `pkeyutl -rawin`; pick an OpenSSL 3 binary.
          OSSL=openssl
          for c in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl openssl; do
            if "$c" version 2>/dev/null | grep -q '^OpenSSL 3'; then OSSL="$c"; break; fi
          done
          "$OSSL" pkeyutl -sign -rawin -inkey update_key.pem -in "$SITE/manifest.json" -out update.sig.bin
          # stdin keeps base64 portable: macOS BSD base64 rejects a positional file arg
          base64 < update.sig.bin | tr -d '\n' > "$SITE/manifest.sig"
          rm -f update_key.pem update.sig.bin

      - uses: actions/upload-artifact@v7
        with:
          name: pages-${{ matrix.rid }}
          path: site/${{ matrix.rid }}
          include-hidden-files: true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: upload/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: false

  # Host the per-platform loose file tree + signed manifest for the in-app auto-updater.
  pages:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pages-*
          path: site-dl
      - name: Assemble site
        shell: bash
        run: |
          mkdir -p site
          for d in site-dl/pages-*; do
            rid="$(basename "$d" | sed 's/^pages-//')"
            mkdir -p "site/$rid"
            cp -R "$d"/. "site/$rid"/
          done
          # || true: head's early exit SIGPIPEs ls; with pipefail that fails the step
          ls -R site | head -50 || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
