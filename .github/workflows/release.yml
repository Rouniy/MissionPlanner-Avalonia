name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: src/MissionPlannerAvalonia/MissionPlannerAvalonia.csproj

jobs:
  validate-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check tag matches MissionPlanner, build date and commit
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ ! "$V" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]{8})\.([0-9a-fA-F]{7})(-beta(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must be v<MP-version>-<yyyyMMdd>.<short-hash> or add -beta[.N]."
            exit 1
          fi
          TAG_BASE="${BASH_REMATCH[1]}"
          TAG_DATE="${BASH_REMATCH[2]}"
          TAG_HASH="${BASH_REMATCH[3],,}"
          OFFICIAL="$(sed -nE 's/.*AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\).*/\1/p' \
            external/MissionPlanner/Properties/AssemblyInfo.cs | head -1)"
          ACTUAL_HASH="$(git rev-parse --short=7 HEAD)"
          if [[ "$TAG_BASE" != "$OFFICIAL" ]]; then
            echo "::error::Tag version $TAG_BASE does not match pinned MissionPlanner $OFFICIAL."
            exit 1
          fi
          if [[ "$TAG_HASH" != "$ACTUAL_HASH" ]]; then
            echo "::error::Tag hash $TAG_HASH does not match its port commit $ACTUAL_HASH."
            exit 1
          fi
          if ! date -u -d "$TAG_DATE" +%Y%m%d | grep -qx "$TAG_DATE"; then
            echo "::error::Tag build date $TAG_DATE is invalid."
            exit 1
          fi
          echo "OK: MissionPlanner $OFFICIAL, build $TAG_DATE, port $ACTUAL_HASH."

  resolve-version:
    needs: validate-version
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.ver.outputs.base }}
      date: ${{ steps.ver.outputs.date }}
      commit: ${{ steps.ver.outputs.commit }}
      revision: ${{ steps.ver.outputs.revision }}
      version: ${{ steps.ver.outputs.version }}
      artifact: ${{ steps.ver.outputs.artifact }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Resolve version once for all platforms
        id: ver
        shell: bash
        run: |
          PRERELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([0-9]{8})\.([0-9a-fA-F]{7})(-beta(\.[0-9]+)?)?$ ]]; then
              export MISSIONPLANNER_BUILD_DATE="${BASH_REMATCH[1]}"
              export MISSIONPLANNER_COMMIT="${BASH_REMATCH[2]}"
              [[ -n "${BASH_REMATCH[3]}" ]] && PRERELEASE=true
            fi
          fi
          export MISSIONPLANNER_DIRTY_SUFFIX=""
          source build/version.sh
          echo "base=$MP_UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$MP_BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "commit=$MP_COMMIT" >> "$GITHUB_OUTPUT"
          echo "revision=$MP_PORT_REVISION" >> "$GITHUB_OUTPUT"
          echo "version=$MP_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=$MP_ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      MP_RELEASE_BASE: ${{ needs.resolve-version.outputs.base }}
      MP_RELEASE_DATE: ${{ needs.resolve-version.outputs.date }}
      MP_RELEASE_COMMIT: ${{ needs.resolve-version.outputs.commit }}
      MP_RELEASE_REVISION: ${{ needs.resolve-version.outputs.revision }}
      MP_RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      MP_RELEASE_ARTIFACT: ${{ needs.resolve-version.outputs.artifact }}
      MP_RELEASE_PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Package macOS (.app, self-contained, signed + notarized)
        if: matrix.rid == 'osx-x64'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          rm -rf out/osx dist
          dotnet publish "$APP" -c Release -r osx-x64 --self-contained true \
            -m:1 \
            -p:DebugType=none -p:StripSymbols=true \
            -p:MissionPlannerUpstreamVersion="$MP_RELEASE_BASE" \
            -p:MissionPlannerBuildDate="$MP_RELEASE_DATE" \
            -p:MissionPlannerCommit="$MP_RELEASE_COMMIT" \
            -o out/osx

          # Import the Developer ID cert into a throwaway keychain when secrets are present;
          # make-app.sh does hardened-runtime signing if SIGN_IDENTITY is exported, else ad-hoc.
          if [[ -n "$MACOS_CERT_P12" && -n "$MACOS_SIGN_IDENTITY" ]]; then
            KP="$(uuidgen)"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p "$KP" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KP" "$KEYCHAIN"
            echo "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/cert.p12"
            if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
              echo "::error::No Developer ID Application identity after import — check MACOS_CERT_P12 (must be built with OpenSSL -legacy) and MACOS_CERT_PASSWORD."
              exit 1
            fi
            export SIGN_IDENTITY="$MACOS_SIGN_IDENTITY"
          fi

          chmod +x build/macos/make-app.sh
          ./build/macos/make-app.sh out/osx "$MP_RELEASE_BASE" "dist/Mission Planner.app"

          mkdir -p upload
          ZIP="upload/MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-osx-x64.zip"
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent "Mission Planner.app" "../$ZIP" )

          # Notarize the zip, then staple the ticket onto the bundle and re-zip so the
          # stapled .app is what ships. No creds (forks) => skip; ad-hoc build still uploads.
          if [[ -n "$MACOS_NOTARY_KEY" && -n "$MACOS_NOTARY_KEY_ID" && -n "$MACOS_NOTARY_ISSUER" ]]; then
            echo "$MACOS_NOTARY_KEY" | base64 -D > "$RUNNER_TEMP/nkey.p8"
            xcrun notarytool submit "$ZIP" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" \
              --wait
            rm -f "$RUNNER_TEMP/nkey.p8"
            xcrun stapler staple "dist/Mission Planner.app"
            rm -f "$ZIP"
            ( cd dist && ditto -c -k --sequesterRsrc --keepParent "Mission Planner.app" "../$ZIP" )
          fi

      - name: Package Windows (self-contained folder)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          rm -rf out/win stage
          # Self-contained folder (loose dlls) so the auto-updater can diff and download only the
          # changed files instead of the whole exe.
          dotnet publish "$APP" -c Release -r win-x64 --self-contained true \
            -m:1 \
            -p:DebugType=none \
            -p:MissionPlannerUpstreamVersion="$MP_RELEASE_BASE" \
            -p:MissionPlannerBuildDate="$MP_RELEASE_DATE" \
            -p:MissionPlannerCommit="$MP_RELEASE_COMMIT" \
            -o out/win
          DIR="MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-win-x64"
          mkdir -p "stage/$DIR"
          cp -r out/win/. "stage/$DIR/"
          mkdir -p upload
          ( cd stage && 7z a -tzip "../upload/$DIR.zip" "$DIR" >/dev/null )

      - name: Package Linux (self-contained)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          MISSIONPLANNER_UPSTREAM_VERSION="$MP_RELEASE_BASE" \
          MISSIONPLANNER_BUILD_DATE="$MP_RELEASE_DATE" \
          MISSIONPLANNER_COMMIT="$MP_RELEASE_COMMIT" \
          MISSIONPLANNER_PORT_REVISION="$MP_RELEASE_REVISION" \
          MISSIONPLANNER_DIRTY_SUFFIX="" \
          PACKAGE_VERSION="$MP_RELEASE_VERSION" \
          OUTPUT_DIR="$GITHUB_WORKSPACE/upload" \
          PUBLISH_PARENT="$GITHUB_WORKSPACE/out" \
          ./build/linux/package.sh all

      - name: Build + sign update manifest
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          RID=${{ matrix.rid }}
          case "$RID" in
            win-x64)   PUB=out/win ;;
            osx-x64)   PUB=out/osx ;;
            linux-x64) PUB="out/MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-linux-x64" ;;
          esac
          SITE="site/$RID"
          rm -rf "$SITE"; mkdir -p "$SITE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          else
            NOTES="https://github.com/${GITHUB_REPOSITORY}/releases"
          fi
          if [[ "$MP_RELEASE_PRERELEASE" == "true" ]]; then
            if [[ "$RID" == "osx-x64" ]]; then
              BUNDLE="upload/MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-osx-x64.zip"
            else
              BUNDLE="upload/MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-$RID-update.zip"
              python3 build/make-update-bundle.py "$PUB" "$BUNDLE"
            fi
            BUNDLE_NAME="$(basename "$BUNDLE")"
            BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$BUNDLE_NAME"
            BUNDLE_SHA=$(shasum -a 256 "$BUNDLE" | awk '{print $1}')
            BUNDLE_SIZE=$(python3 -c 'import os,sys; print(os.path.getsize(sys.argv[1]))' "$BUNDLE")
            python3 build/gen-manifest.py "$SITE" "$MP_RELEASE_VERSION" "$NOTES" "$SITE/manifest.json" \
              --bundle-url "$BUNDLE_URL" --bundle-sha256 "$BUNDLE_SHA" --bundle-size "$BUNDLE_SIZE"
          elif [[ "$RID" == "osx-x64" ]]; then
            # macOS updates whole-bundle (notarization can't survive loose-file swaps). The manifest
            # points at the notarized .app zip that the release job publishes as a release asset; the
            # URL is deterministic from the tag, so it resolves once release + pages jobs finish.
            ZIP="upload/MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-osx-x64.zip"
            BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/MissionPlannerAvalonia-$MP_RELEASE_ARTIFACT-osx-x64.zip"
            BUNDLE_SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
            BUNDLE_SIZE=$(stat -f%z "$ZIP")
            python3 build/gen-manifest.py "$SITE" "$MP_RELEASE_VERSION" "$NOTES" "$SITE/manifest.json" \
              --bundle-url "$BUNDLE_URL" --bundle-sha256 "$BUNDLE_SHA" --bundle-size "$BUNDLE_SIZE"
          else
            cp -R "$PUB"/. "$SITE"/
            python3 build/gen-manifest.py "$SITE" "$MP_RELEASE_VERSION" "$NOTES" "$SITE/manifest.json"
          fi
          # Sign the exact manifest bytes with the Ed25519 private key (raw 64-byte sig, base64).
          printf '%s' "$SIGNING_KEY" > update_key.pem
          # macOS runners ship LibreSSL, which lacks `pkeyutl -rawin`; pick an OpenSSL 3 binary.
          OSSL=openssl
          for c in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl openssl; do
            if "$c" version 2>/dev/null | grep -q '^OpenSSL 3'; then OSSL="$c"; break; fi
          done
          "$OSSL" pkeyutl -sign -rawin -inkey update_key.pem -in "$SITE/manifest.json" -out update.sig.bin
          # stdin keeps base64 portable: macOS BSD base64 rejects a positional file arg
          base64 < update.sig.bin | tr -d '\n' > "$SITE/manifest.sig"
          rm -f update_key.pem update.sig.bin
          if [[ "$MP_RELEASE_PRERELEASE" == "true" ]]; then
            cp "$SITE/manifest.json" "upload/$RID-manifest.json"
            cp "$SITE/manifest.sig" "upload/$RID-manifest.sig"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pages-${{ matrix.rid }}
          path: site/${{ matrix.rid }}
          include-hidden-files: true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: upload/*

  release:
    needs: [resolve-version, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}

  # Host the per-platform loose file tree + signed manifest for the in-app auto-updater.
  pages:
    needs: [resolve-version, package]
    if: startsWith(github.ref, 'refs/tags/') && needs.resolve-version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pages-*
          path: site-dl
      - name: Assemble site
        shell: bash
        run: |
          mkdir -p site
          for d in site-dl/pages-*; do
            rid="$(basename "$d" | sed 's/^pages-//')"
            mkdir -p "site/$rid"
            cp -R "$d"/. "site/$rid"/
          done
          # || true: head's early exit SIGPIPEs ls; with pipefail that fails the step
          ls -R site | head -50 || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
